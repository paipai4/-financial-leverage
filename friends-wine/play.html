<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,
	height=device-height,
	user-scalable=no,
	interactive-widget=resizes-content,
	viewport-fit=cover">
<meta name="theme-color" content="#444">
<title>朋友的酒 Friends Wine</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/common/client.css">
<link rel="stylesheet" href="play.css">
<script defer src="/common/client.js"></script>
<script defer src="data.js"></script>
<script defer src="play.js"></script>
</head>
<body class="friends-wine">

<header>
	<div id="toolbar">
		<details>
			<summary><img src="/images/cog.svg"></summary>
			<menu></menu>
		</details>
	</div>
	<!-- #actions 与 #prompt 由 /common/client.js 自动注入 -->
</header>

<aside>
	<div id="roles">
		<!-- 角色卡由 client.js 动态生成（role_name/role_stat/role_user），
		     此处不写死任何“玩家 A · 王总”标签；颜色彩带见 play.css -->
	</div>
	<div id="turn_info"></div>
	<div id="log"></div>
</aside>

<main>
	<div id="tablewrap">
		<!-- 拍卖台 / 城市列 / 玩家面板由 play.js 渲染 -->
		<div id="stage"></div>
		<div id="cities"></div>
		<div id="players"></div>
	</div>
</main>

<div id="tooltip" hidden></div>

<dialog id="auction_dialog" class="modal-dialog">
	<div id="auction_body"></div>
</dialog>

<footer id="status"></footer>

</body>
</html>
