<h1>朋友的酒（Friends Wine）</h1>
<p>原创都市房地产博弈的 RTT 移植版。桌上有「玩家人数 + 1」座城市，每座城市有银行、政府、消费者三个池子：银行放贷你竞拍偿还倍数，政府挂地你竞拍底价倍数，消费者池回收土地、也收你的造房费。4 个回合共 16~24 个阶段里倒手腾挪，第 4 回合结束时现金最多者赢。</p>
<p>资不抵债会破产离场；任一城市政府关系 ≤ -2 会在回合结束被逮捕。每回合发一轮花式手牌：围猎、回扣、炒房团、双规、房闹、保交楼……什么都可以没有，关系不能没有。</p>
<p>支持 2~6 人自由选择座位数量（城市数 = 玩家人数 + 1）。完整规则见模块目录下《朋友的酒规则书.txt》。</p>
